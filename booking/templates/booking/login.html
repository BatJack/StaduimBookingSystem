{% extends 'booking/base.html' %}

{% block title %}登录 - 体育场馆预约系统{% endblock %}

{% block content %}
<style>
    .login-page-bg {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: var(--bg-secondary);
        z-index: -1;
    }

    .login-bg-shape {
        position: absolute;
        z-index: 0;
    }

    .login-bg-shape.shape-1 {
        width: 400px;
        height: 400px;
        background: var(--theme-primary);
        top: -100px;
        right: -100px;
        border-radius: 50%;
    }

    .login-bg-shape.shape-2 {
        width: 300px;
        height: 300px;
        background: var(--theme-success);
        bottom: -80px;
        left: -80px;
        border-radius: 50%;
    }

    .login-bg-shape.shape-3 {
        width: 200px;
        height: 200px;
        background: var(--theme-danger);
        top: 40%;
        left: 10%;
        transform: rotate(45deg);
    }

    .login-bg-shape.shape-4 {
        width: 150px;
        height: 150px;
        background: var(--theme-warning);
        bottom: 30%;
        right: 15%;
        border-radius: 50%;
    }

    .login-container {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        position: relative;
        z-index: 1;
    }

    .login-card {
        width: 100%;
        max-width: 400px;
        background: var(--bg-primary);
        padding: 48px 40px;
        border-radius: 0;
        position: relative;
    }

    .login-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 6px;
        height: 100%;
        background: var(--theme-primary);
    }

    .login-header {
        text-align: left;
        margin-bottom: 40px;
    }

    .login-header h2 {
        font-size: 32px;
        font-weight: 700;
        color: var(--text-primary);
        margin-bottom: 8px;
        letter-spacing: -0.5px;
    }

    .login-header p {
        color: var(--text-secondary);
        font-size: 15px;
    }

    .login-form {
        display: flex;
        flex-direction: column;
        gap: 24px;
    }

    .login-form .form-group {
        position: relative;
    }

    .login-form .form-group label {
        display: block;
        margin-bottom: 10px;
        font-weight: 600;
        color: var(--text-primary);
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    .login-input-wrapper {
        position: relative;
    }

    .login-input-wrapper input {
        width: 100%;
        padding: 16px 16px 16px 50px;
        background: var(--theme-border-light);
        border: 3px solid transparent;
        font-size: 15px;
        color: var(--text-primary);
        border-radius: 0;
        transition: var(--transition);
    }

    .login-input-wrapper input:focus {
        outline: none;
        background: var(--bg-primary);
        border-color: var(--theme-primary);
    }

    .login-input-wrapper input::placeholder {
        color: var(--gray-400);
    }

    .login-input-icon {
        position: absolute;
        left: 16px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-secondary);
    }

    .login-input-wrapper input:focus + .login-input-icon {
        color: var(--theme-primary);
    }

    .btn-login {
        width: 100%;
        padding: 18px 24px;
        font-size: 16px;
        font-weight: 700;
        background: var(--theme-primary);
        color: var(--bg-primary);
        border: none;
        cursor: pointer;
        border-radius: 0;
        text-transform: uppercase;
        letter-spacing: 1px;
        transition: background 0.2s ease;
        margin-top: 8px;
    }

    .btn-login:hover {
        background: var(--theme-primary-hover);
    }

    .btn-login:active {
        background: #21618c;
    }

    .btn-login:disabled {
        background: var(--theme-border);
        cursor: not-allowed;
    }

    .btn-login .login-spinner {
        display: none;
        width: 20px;
        height: 20px;
        border: 3px solid rgba(255, 255, 255, 0.3);
        border-top-color: white;
        border-radius: 50%;
        animation: login-spin 0.8s linear infinite;
        margin-right: 8px;
        vertical-align: middle;
    }

    .btn-login.loading .login-spinner {
        display: inline-block;
    }

    @keyframes login-spin {
        to { transform: rotate(360deg); }
    }

    .login-footer {
        text-align: center;
        margin-top: 32px;
        padding-top: 24px;
        border-top: 3px solid var(--theme-border-light);
    }

    .login-footer p {
        color: var(--text-secondary);
        font-size: 14px;
    }

    .login-footer a {
        color: var(--theme-primary);
        text-decoration: none;
        font-weight: 600;
        transition: color 0.2s ease;
    }

    .login-footer a:hover {
        color: var(--theme-primary-hover);
    }

    .login-color-bar {
        display: flex;
        margin-top: 32px;
    }

    .login-color-bar span {
        flex: 1;
        height: 6px;
    }

    .login-color-bar span:nth-child(1) { background: var(--theme-primary); }
    .login-color-bar span:nth-child(2) { background: var(--theme-success); }
    .login-color-bar span:nth-child(3) { background: var(--theme-warning); }
    .login-color-bar span:nth-child(4) { background: var(--theme-danger); }

    .login-remember {
        margin-top: -8px;
    }

    .login-checkbox-label {
        display: flex;
        align-items: center;
        cursor: pointer;
        user-select: none;
    }

    .login-checkbox-label input[type="checkbox"] {
        position: absolute;
        opacity: 0;
        cursor: pointer;
        height: 0;
        width: 0;
    }

    .login-checkbox-custom {
        position: relative;
        display: inline-block;
        width: 20px;
        height: 20px;
        background: var(--theme-border-light);
        border: 2px solid var(--theme-border);
        margin-right: 10px;
        transition: var(--transition);
    }

    .login-checkbox-custom::after {
        content: '';
        position: absolute;
        display: none;
        left: 6px;
        top: 2px;
        width: 5px;
        height: 10px;
        border: solid var(--bg-primary);
        border-width: 0 2px 2px 0;
        transform: rotate(45deg);
    }

    .login-checkbox-label input:checked + .login-checkbox-custom {
        background: var(--theme-primary);
        border-color: var(--theme-primary);
    }

    .login-checkbox-label input:checked + .login-checkbox-custom::after {
        display: block;
    }

    .login-checkbox-label:hover .login-checkbox-custom {
        border-color: var(--theme-primary);
    }

    .login-checkbox-text {
        font-size: 14px;
        color: var(--text-secondary);
        font-weight: 500;
    }

    @media (max-width: 480px) {
        .login-card {
            padding: 36px 24px;
        }

        .login-header h2 {
            font-size: 28px;
        }

        .login-bg-shape.shape-1 {
            width: 250px;
            height: 250px;
        }

        .login-bg-shape.shape-2 {
            width: 180px;
            height: 180px;
        }

        .login-bg-shape.shape-3 {
            width: 120px;
            height: 120px;
        }

        .login-bg-shape.shape-4 {
            width: 100px;
            height: 100px;
        }
    }
</style>

<div class="login-page-bg">
    <div class="login-bg-shape shape-1"></div>
    <div class="login-bg-shape shape-2"></div>
    <div class="login-bg-shape shape-3"></div>
    <div class="login-bg-shape shape-4"></div>
</div>

<div class="login-container">
    <div class="login-card">
        <div class="login-header">
            <h2>欢迎回来</h2>
            <p>登录您的账户以继续</p>
        </div>

        <form method="post" class="login-form" id="loginForm">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="username">用户名</label>
                <div class="login-input-wrapper">
                    <input type="text" id="username" name="username" placeholder="请输入用户名" required autofocus>
                    <svg class="login-input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                        <circle cx="12" cy="7" r="4"/>
                    </svg>
                </div>
            </div>

            <div class="form-group">
                <label for="password">密码</label>
                <div class="login-input-wrapper">
                    <input type="password" id="password" name="password" placeholder="请输入密码" required>
                    <svg class="login-input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    </svg>
                </div>
            </div>

            <div class="form-group login-remember">
                <label class="login-checkbox-label">
                    <input type="checkbox" id="rememberMe" name="remember_me">
                    <span class="login-checkbox-custom"></span>
                    <span class="login-checkbox-text">记住我</span>
                </label>
            </div>

            <button type="submit" class="btn-login" id="loginBtn">
                <span class="login-spinner"></span>
                <span class="btn-text">登录</span>
            </button>
        </form>

        <div class="login-footer">
            <p>还没有账户？ <a href="#">联系管理员</a></p>
        </div>

        <div class="login-color-bar">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
        </div>
    </div>
</div>

<script>
    (function() {
        const form = document.getElementById('loginForm');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const rememberMeCheckbox = document.getElementById('rememberMe');
        const loginBtn = document.getElementById('loginBtn');

        function loadSavedCredentials() {
            const savedUsername = localStorage.getItem('rememberedUsername');
            const savedPassword = localStorage.getItem('rememberedPassword');
            
            if (savedUsername && savedPassword) {
                usernameInput.value = savedUsername;
                passwordInput.value = savedPassword;
                rememberMeCheckbox.checked = true;
            }
        }

        function saveCredentials() {
            if (rememberMeCheckbox.checked) {
                localStorage.setItem('rememberedUsername', usernameInput.value);
                localStorage.setItem('rememberedPassword', passwordInput.value);
            } else {
                localStorage.removeItem('rememberedUsername');
                localStorage.removeItem('rememberedPassword');
            }
        }

        loadSavedCredentials();

        form.addEventListener('submit', function(e) {
            saveCredentials();
            loginBtn.classList.add('loading');
            loginBtn.disabled = true;
        });

        rememberMeCheckbox.addEventListener('change', function() {
            if (!this.checked) {
                localStorage.removeItem('rememberedUsername');
                localStorage.removeItem('rememberedPassword');
            }
        });
    })();
</script>
{% endblock %}
