{% extends 'booking/base.html' %}

{% block title %}添加预约 - 体育场馆预约系统{% endblock %}

{% block content %}
{% include 'booking/includes/page_header.html' with title="添加预约" back_url="/manage/bookings/" back_text="返回预约列表" %}

<div class="card" style="max-width: 600px; margin: 0 auto;">
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label for="username">用户名</label>
            <input type="text" id="username" name="username" placeholder="请输入用户名" required>
        </div>
        <div class="form-group">
            <label for="court">场地</label>
            <select id="court" name="court" required>
                <option value="">请选择场地</option>
                {% for court in courts %}
                    <option value="{{ court.id }}">{{ court.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label for="date">预约日期</label>
            <input type="date" id="date" name="date" required>
        </div>
        <div class="form-group">
            <label for="start_time">开始时间</label>
            <input type="time" id="start_time" name="start_time" step="1800" required>
            <small>时间必须是整点或半点</small>
        </div>
        <div class="form-group">
            <label for="end_time">结束时间</label>
            <input type="time" id="end_time" name="end_time" step="1800" required>
            <small>时间必须是整点或半点</small>
        </div>
        <div class="form-group">
            <label for="booker_name">预约人姓名</label>
            <input type="text" id="booker_name" name="booker_name" placeholder="请输入预约人姓名" required>
        </div>
        <div class="form-group">
            <label for="booker_phone">联系方式（手机号）</label>
            <input type="tel" id="booker_phone" name="booker_phone" placeholder="请输入手机号码" required>
        </div>
        <div style="display: flex; gap: 12px; margin-top: 24px;">
            <button type="submit" class="btn btn-success">添加预约</button>
            <a href="{% url 'admin_bookings' %}" class="btn btn-outline">取消</a>
        </div>
    </form>
</div>
{% endblock %}
