{% comment %}
数据表格组件 - 统一表格包装器和表头样式

用法 1: 带标题和操作按钮
<div class="card">
    <div class="table-header">
        <h2>表格标题</h2>
        <div class="header-actions">
            按钮...
        </div>
    </div>
    <div class="table-wrapper">
        <table>...</table>
    </div>
</div>

用法 2: 简洁版（无标题）
<div class="card">
    <div class="table-wrapper">
        <table>...</table>
    </div>
</div>
{% endcomment %}
