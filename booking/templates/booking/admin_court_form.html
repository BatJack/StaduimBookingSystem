{% extends 'booking/base.html' %}

{% block title %}{% if court %}编辑场地{% else %}添加场地{% endif %} - 体育场馆预约系统{% endblock %}

{% block content %}
<style>
    .form-row {
        display: flex;
        gap: 16px;
    }
    .form-row .form-group {
        flex: 1;
    }
</style>

{% include 'booking/includes/page_header.html' with title="编辑场地" back_url="/manage/courts/" back_text="返回场地列表" %}

<div class="card" style="max-width: 600px; margin: 0 auto;">
    <form method="post">
        {% csrf_token %}
        <div class="form-row">
            <div class="form-group">
                <label for="court_type">场地类型</label>
                <select id="court_type" name="court_type">
                    <option value="">-- 请选择 --</option>
                    {% for ct in court_types %}
                        <option value="{{ ct.id }}" {% if court and court.court_type_id == ct.id %}selected{% endif %}>{{ ct.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="court_number">场地编号</label>
                <input type="text" id="court_number" name="court_number" value="{% if court %}{{ court.court_number }}{% endif %}" placeholder="如：1号场、A区">
            </div>
        </div>
        <div class="form-group">
            <label for="name">场地名称</label>
            <input type="text" id="name" name="name" value="{% if court %}{{ court.name }}{% endif %}" placeholder="请输入场地名称" required>
        </div>
        <div class="form-group">
            <label for="description">场地描述</label>
            <textarea id="description" name="description" rows="4" placeholder="请输入场地描述">{% if court %}{{ court.description }}{% endif %}</textarea>
        </div>
        <div style="display: flex; gap: 12px; margin-top: 24px;">
            <button type="submit" class="btn btn-success">{% if court %}更新{% else %}添加{% endif %}</button>
            <a href="{% url 'admin_court_list' %}" class="btn btn-outline">取消</a>
        </div>
    </form>
</div>
{% endblock %}
